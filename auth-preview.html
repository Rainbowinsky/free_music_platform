<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录注册弹窗 · 设计预览</title>
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <style>
    /* 预览页辅助：顶部的说明条 */
    .preview-note {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(20, 26, 34, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .preview-note button {
      color: #4fd996;
      margin-left: 10px;
      font-size: 12px;
    }
    .preview-note button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="preview-note">
    登录 / 注册弹窗设计预览
    <button id="toggle-tab" type="button">切换到注册</button>
  </div>

  <div class="modal-mask auth-mask">
    <div class="particle-bg" aria-hidden="true">
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="aurora aurora-c"></div>
      <canvas class="particle-canvas" id="particles"></canvas>
      <div class="particle-vignette"></div>
    </div>

    <div class="auth-modal" role="dialog" aria-modal="true">
      <button type="button" class="auth-close" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>

      <div class="auth-head">
        <span class="logo-mark logo-mark-lg auth-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M9.6 18.4V7.2l9-1.6v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.2" cy="18.4" r="2.4"/><circle cx="16.2" cy="16.6" r="2.4"/></svg>
        </span>
        <h3>欢迎来到 QQ音乐</h3>
        <p class="auth-sub">登录后即可收藏喜欢的歌曲与歌单</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <span class="auth-tab-slider" id="tab-slider"></span>
        <button type="button" class="auth-tab is-active" data-tab="login">登录</button>
        <button type="button" class="auth-tab" data-tab="register">注册</button>
      </div>

      <form class="auth-form" onsubmit="return false">
        <label class="auth-field">
          <span>账号</span>
          <span class="auth-input-wrap">
            <svg class="auth-input-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.4" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.8 19.4c1-3.2 3.8-5 7.2-5s6.2 1.8 7.2 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input placeholder="2-16 位中文、字母、数字或下划线" />
          </span>
        </label>

        <label class="auth-field auth-field-enter" id="nickname-field" style="display:none">
          <span>昵称</span>
          <span class="auth-input-wrap">
            <svg class="auth-input-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.6 14.2a4.4 4.4 0 0 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9.2" cy="10" r="0.9"/><circle cx="14.8" cy="10" r="0.9"/></svg>
            <input placeholder="选填，默认与账号相同" />
          </span>
        </label>

        <label class="auth-field">
          <span>密码</span>
          <span class="auth-input-wrap">
            <svg class="auth-input-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="4.5" y="10" width="15" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7.2a4 4 0 0 1 8 0V10" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="14.6" r="1.4"/></svg>
            <input type="password" id="pwd" placeholder="至少 6 位" />
            <button type="button" class="auth-eye" id="eye-btn" aria-label="显示密码">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2.8 12S6.2 5.8 12 5.8 21.2 12 21.2 12 17.8 18.2 12 18.2 2.8 12 2.8 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
            </button>
          </span>
        </label>

        <button type="submit" class="btn auth-submit btn-block">
          <span class="auth-submit-label" id="submit-label">登录</span>
        </button>
      </form>

      <p class="auth-foot">
        <span id="foot-text">还没有账号？</span>
        <button type="button" class="link-btn" id="foot-link">立即注册</button>
      </p>
      <p class="auth-tip">账号与管理台共用，登录后收藏、歌单在任意浏览器都可用</p>
    </div>
  </div>

  <script>
    // 与 ParticleBackground.tsx 相同的 Canvas 粒子逻辑（原生 JS 版，仅用于本预览页）
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var width = 0, height = 0, running = true;
      var mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };
      var PALETTE = [[49,194,124],[45,212,191],[56,132,255],[139,92,246],[35,168,102]];
      function rand(a, b) { return a + Math.random() * (b - a); }
      var orbCount = Math.max(10, Math.min(18, Math.round(window.innerWidth * window.innerHeight / 110000)));
      var dustCount = Math.max(36, Math.min(80, Math.round(window.innerWidth * window.innerHeight / 22000)));
      var orbs = [], dust = [], i;
      for (i = 0; i < orbCount; i++) orbs.push({
        bx: Math.random(), by: Math.random(), r: rand(0.06, 0.2),
        hue: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        alpha: rand(0.1, 0.26), ax: rand(0.02, 0.09), ay: rand(0.02, 0.09),
        speed: rand(0.00008, 0.00022), phase: Math.random() * Math.PI * 2, parallax: rand(6, 26)
      });
      for (i = 0; i < dustCount; i++) dust.push({
        bx: Math.random(), by: Math.random(), r: rand(0.6, 1.8),
        alpha: rand(0.15, 0.5), speed: rand(0.0004, 0.0012),
        phase: Math.random() * Math.PI * 2, parallax: rand(2, 10)
      });
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth; height = canvas.clientHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function frame(t) {
        if (!running) return;
        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';
        var base = Math.min(width, height), j, o, x, y, radius, breathe, g;
        for (j = 0; j < orbs.length; j++) {
          o = orbs[j];
          x = (o.bx + Math.cos(t * o.speed + o.phase) * o.ax) * width + (mouse.x - 0.5) * o.parallax;
          y = (o.by + Math.sin(t * o.speed * 1.2 + o.phase) * o.ay) * height + (mouse.y - 0.5) * o.parallax;
          radius = o.r * base;
          breathe = 0.75 + 0.25 * Math.sin(t * 0.0004 + o.phase * 2);
          g = ctx.createRadialGradient(x, y, 0, x, y, radius);
          g.addColorStop(0, 'rgba(' + o.hue[0] + ',' + o.hue[1] + ',' + o.hue[2] + ',' + (o.alpha * breathe).toFixed(3) + ')');
          g.addColorStop(0.55, 'rgba(' + o.hue[0] + ',' + o.hue[1] + ',' + o.hue[2] + ',' + (o.alpha * 0.45 * breathe).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(' + o.hue[0] + ',' + o.hue[1] + ',' + o.hue[2] + ',0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        var d, drift, twinkle;
        for (j = 0; j < dust.length; j++) {
          d = dust[j];
          drift = (t * d.speed + d.phase) % 1;
          x = d.bx * width + Math.sin(t * 0.0003 + d.phase) * 8 + (mouse.x - 0.5) * d.parallax;
          y = (1 - drift) * height + (mouse.y - 0.5) * d.parallax;
          twinkle = 0.5 + 0.5 * Math.sin(t * 0.001 + d.phase * 3);
          ctx.fillStyle = 'rgba(255,255,255,' + (d.alpha * twinkle).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!reduced) requestAnimationFrame(frame);
      }
      resize();
      requestAnimationFrame(frame);
      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', function (e) {
        mouse.tx = e.clientX / window.innerWidth;
        mouse.ty = e.clientY / window.innerHeight;
      }, { passive: true });

      // 预览页交互：切换登录/注册、密码可见
      var tab = 'login';
      var slider = document.getElementById('tab-slider');
      var tabs = document.querySelectorAll('.auth-tab');
      var nickname = document.getElementById('nickname-field');
      var submitLabel = document.getElementById('submit-label');
      var footText = document.getElementById('foot-text');
      var footLink = document.getElementById('foot-link');
      var noteBtn = document.getElementById('toggle-tab');
      function setTab(next) {
        tab = next;
        slider.classList.toggle('is-right', tab === 'register');
        tabs.forEach(function (el) { el.classList.toggle('is-active', el.dataset.tab === tab); });
        nickname.style.display = tab === 'register' ? '' : 'none';
        submitLabel.textContent = tab === 'login' ? '登录' : '注册并登录';
        footText.textContent = tab === 'login' ? '还没有账号？' : '已有账号？';
        footLink.textContent = tab === 'login' ? '立即注册' : '去登录';
        noteBtn.textContent = tab === 'login' ? '切换到注册' : '切换到登录';
      }
      tabs.forEach(function (el) { el.addEventListener('click', function () { setTab(el.dataset.tab); }); });
      footLink.addEventListener('click', function () { setTab(tab === 'login' ? 'register' : 'login'); });
      noteBtn.addEventListener('click', function () { setTab(tab === 'login' ? 'register' : 'login'); });
      var pwd = document.getElementById('pwd');
      document.getElementById('eye-btn').addEventListener('click', function () {
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
      });
    })();
  </script>
</body>
</html>
